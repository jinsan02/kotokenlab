<text x="0" y="24" font-size="18" font-weight="600" class="ink">전체 파이프라인 — 데이터는 먼저 나누고, 숫자는 모두 원장으로</text><text x="0" y="48" font-size="14" class="sub">Final Test는 봉인 · 세 조건 모두 같은 원문으로 CPT · 모든 결과는 append-only TSV</text>
