<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 0 1104 496" width="1104" height="496" role="img" aria-label="데이터를 문서 단위로 먼저 나누고(Final Test 봉인), Qwen2.5-0.5B에 토크나이저 수술·임베딩 초기화·같은 원문 CPT·평가를 거친 뒤 모든 결과를 append-only TSV 원장에 남긴다">
<title>전체 파이프라인 — 데이터는 먼저 나누고, 숫자는 모두 원장으로</title>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #1f2328; }
