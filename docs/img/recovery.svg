<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 436" width="820" height="436" role="img" aria-label="한국어 dev BPB: 원본 1.1569, T2b 수술 직후 2.3803, 코사인 CPT 뒤 T2b 1.5671 · C0 1.1375, 상수 LR CPT 뒤 T2b 1.4730 · C0 1.1274">
