<text x="0" y="26" font-size="18" font-weight="600">CPT 는 손상의 대부분을 메웠지만 격차는 남았다</text>
<text x="0" y="50" font-size="14" class="sub">한국어 dev BPB (낮을수록 좋다) · seed 42 · 같은 원문 168.5MB · 상수 LR 이 코사인보다 격차를 줄였다</text>
<rect class="c1" x="0" y="64" width="12" height="12" rx="2"/><text x="18" y="75" font-size="13">T2b (어휘 치환)</text><rect class="c2" x="140" y="64" width="12" height="12" rx="2"/><text x="158" y="75" font-size="13">C0 (원본 + 같은 CPT)</text><rect class="cg" x="320" y="64" width="12" height="12" rx="2"/><text x="338" y="75" font-size="13">출발점</text>
