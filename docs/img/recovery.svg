<text x="0" y="428" font-size="12" class="muted">R = (B0 − Bf)/(B0 − Cf) 는 보조 지표다 — 1차 지표는 격차 d = Bf − Cf (RULES 14b). 상수 LR 쌍은 R5 seed 42.</text>
