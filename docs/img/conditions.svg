<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 0 1054 372" width="1054" height="372" role="img" aria-label="C0·T2a·T2b 세 조건을 같은 원문 168.5MB·같은 스케줄로 CPT해 비교했다. T2a는 저하가 검출되지 않았고 T2b는 토큰이 30.2% 줄었지만 한국어 BPB가 37.8% 나빠졌다">
<title>실험 설계 — 어휘만 바꾸고 나머지는 같게</title>
<style>
