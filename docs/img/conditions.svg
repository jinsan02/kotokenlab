<text x="0" y="24" font-size="18" font-weight="600" class="ink">실험 설계 — 어휘만 바꾸고 나머지는 같게</text><text x="0" y="48" font-size="14" class="sub">C0 · T2a · T2b를 같은 원문 168.5MB · 같은 스케줄로 CPT · 파란 경로 = 주 실험 T2b</text>
