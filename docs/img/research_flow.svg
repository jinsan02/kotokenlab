<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 0 1104 456" width="1104" height="456" role="img" aria-label="1차에서 세운 세 가설은 모두 반증됐고, 2차에서 상수 LR만 회복률을 72.42%로 올렸으며, 3차 amendment에서 격차가 seed 우연·update 부족·warm-start로 설명되지 않음을 확인했다">
<title>연구의 흐름 — 가설을 세우고 반증한 순서</title>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #1f2328; }
  .ink { fill: #1f2328; } .sub { fill: #59636e; } .muted { fill: #818b98; } .lbl { fill: #59636e; }
  .grid { stroke: #eaeef2; stroke-width: 1; } .base { stroke: #afb8c1; stroke-width: 1; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; } .s4 { fill: #eda100; }
  .s5 { fill: #e87ba4; } .s6 { fill: #008300; } .s7 { fill: #4a3aa7; } .s8 { fill: #e34948; }
  .dim { fill: #d0d7de; } .dim2 { fill: #8c959f; }
  .box  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
  .em   { fill: #e3eefb; stroke: #2a78d6; stroke-width: 1.6; }
  .mute { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
  .k-auto { fill: #e0f5ec; stroke: #1baf7a; stroke-width: 1.4; }
  .k-man  { fill: #fdf3d8; stroke: #eda100; stroke-width: 1.4; }
  .k-todo { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .grp { fill: none; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3 3; }
  .ln { stroke: #6e7781; stroke-width: 1.4; fill: none; } .ah { fill: #6e7781; }
  .ln-em { stroke: #2a78d6; stroke-width: 2; fill: none; } .ah-em { fill: #2a78d6; }
  .dash { stroke-dasharray: 5 4; }
  @media (prefers-color-scheme: dark) {
    text, .ink { fill: #e6edf3; } .sub, .lbl { fill: #9198a1; } .muted { fill: #8b949e; }
    .grid { stroke: #262c36; } .base { stroke: #59636e; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; } .s4 { fill: #c98500; }
    .s5 { fill: #d55181; } .s6 { fill: #008300; } .s7 { fill: #9085e9; } .s8 { fill: #e66767; }
    .dim { fill: #3d444d; } .dim2 { fill: #6e7681; }
    .box  { fill: #161b22; stroke: #3d444d; }
    .em   { fill: #0f2340; stroke: #3987e5; }
    .mute { fill: #0d1117; stroke: #3d444d; }
    .k-auto { fill: #0c2a1f; stroke: #199e70; } .k-man { fill: #2e2408; stroke: #c98500; } .k-todo { stroke: #6e7681; }
    .grp { stroke: #3d444d; }
    .ln { stroke: #8b949e; } .ah { fill: #8b949e; } .ln-em { stroke: #3987e5; } .ah-em { fill: #3987e5; }
  }
</style>
<text x="0" y="24" font-size="18" font-weight="600" class="ink">연구의 흐름 — 가설을 세우고 반증한 순서</text><text x="0" y="48" font-size="14" class="sub">1차 → 2차 → 3차 amendment · 파란 카드 = 회복률을 실제로 올린 유일한 변경</text>
<g transform="translate(0,64)">
<text x="14" y="30" font-size="13" class="ink" font-weight="600">1차 · 2026-08-29 → 09-02</text>
<rect class="box" x="10" y="46" width="340" height="62" rx="8"/>
<text x="180" y="72" font-size="14" text-anchor="middle" font-weight="600" class="ink">노름 보정이 초기화를 공정하게 만드나</text>
<text x="180" y="91" font-size="13" text-anchor="middle" class="sub">반증 — 한국어 BPB 2.3803 → 3.0017</text>
<rect class="box" x="10" y="122" width="340" height="62" rx="8"/>
<text x="180" y="148" font-size="14" text-anchor="middle" font-weight="600" class="ink">Embedding Alignment로 예열하나</text>
<text x="180" y="167" font-size="13" text-anchor="middle" class="sub">폐기 — 손해 없이 작동하는 lr 없음</text>
<rect class="box" x="10" y="198" width="340" height="62" rx="8"/>
<text x="180" y="224" font-size="14" text-anchor="middle" font-weight="600" class="ink">노출이 부족해서 못 배웠나</text>
<text x="180" y="243" font-size="13" text-anchor="middle" class="sub">지지 안 됨 — 노출 4.4배에 R 65.4 → 65.9%</text>
<polyline class="ln" points="350,77 361,77"/>
<polygon class="ah" points="370,77 361,72 361,82"/>
<text x="374" y="30" font-size="13" class="ink" font-weight="600">2차 · → 2026-09-17</text>
<rect class="box" x="370" y="46" width="340" height="62" rx="8"/>
<text x="540" y="72" font-size="14" text-anchor="middle" font-weight="600" class="ink">R1 임베딩만 망가뜨려도 같은가</text>
<text x="540" y="91" font-size="13" text-anchor="middle" class="sub">부정 — 72.50% vs 치환 50.79%</text>
<rect class="box" x="370" y="122" width="340" height="62" rx="8"/>
<text x="540" y="148" font-size="14" text-anchor="middle" font-weight="600" class="ink">R4 tie를 끊으면 달라지나</text>
<text x="540" y="167" font-size="13" text-anchor="middle" class="sub">구별 불가 — ΔR +0.44%p (17.5MB 설정)</text>
<rect class="em" x="370" y="198" width="340" height="62" rx="8"/>
<text x="540" y="224" font-size="14" text-anchor="middle" font-weight="600" class="ink">R5 상수 LR이면 회복률이 오르나</text>
<text x="540" y="243" font-size="13" text-anchor="middle" class="sub">긍정 — R 72.42% (T2b 3 seed 평균)</text>
<rect class="box" x="370" y="274" width="340" height="62" rx="8"/>
<text x="540" y="300" font-size="14" text-anchor="middle" font-weight="600" class="ink">D1~D3 T2a의 한자 제거가 흔적을 남기나</text>
<text x="540" y="319" font-size="13" text-anchor="middle" class="sub">세 측정에서 검출 안 됨 (seed42 단독)</text>
<polyline class="ln" points="710,77 721,77"/>
<polygon class="ah" points="730,77 721,72 721,82"/>
<text x="734" y="30" font-size="13" class="ink" font-weight="600">3차 amendment · 09-19 → 10-07</text>
<rect class="box" x="730" y="46" width="340" height="62" rx="8"/>
<text x="900" y="72" font-size="14" text-anchor="middle" font-weight="600" class="ink">2주 · 격차가 seed 42의 우연인가</text>
<text x="900" y="91" font-size="13" text-anchor="middle" class="sub">아니다 — 3쌍 d +0.345679, SD 0.000235</text>
<rect class="box" x="730" y="122" width="340" height="62" rx="8"/>
<text x="900" y="148" font-size="14" text-anchor="middle" font-weight="600" class="ink">3주 · update를 덜 받아서인가</text>
<text x="900" y="167" font-size="13" text-anchor="middle" class="sub">주로 아니다 — 같은 update에서 d +0.321189</text>
<rect class="box" x="730" y="198" width="340" height="62" rx="8"/>
<text x="900" y="224" font-size="14" text-anchor="middle" font-weight="600" class="ink">4주 · 새 행만 먼저 학습하면 나은가</text>
<text x="900" y="243" font-size="13" text-anchor="middle" class="sub">아니다 — 직접 CPT보다 0.0117 나쁨</text>
<rect class="box" x="730" y="274" width="340" height="62" rx="8"/>
<text x="900" y="300" font-size="14" text-anchor="middle" font-weight="600" class="ink">5주 · 문서 표본 불확실성은</text>
<text x="900" y="319" font-size="13" text-anchor="middle" class="sub">d +0.345564 · 95% [+0.336924, +0.354955]</text>
<text x="10" y="374" font-size="12" class="lbl">잔차 d = BPB(T2b) − BPB(C0), 한국어 dev, 상수 LR 168.5MB. Final Test는 아직 열지 않았다.</text>
</g>
</svg>
