# D1 — 한자 밀집 한국어 부분집합에서 토큰 비용 (docs/PLAN.md "downstream 과 한자 프로브", 2026-09-13 등록)
# 실행: .conda/python.exe -m src.evaluation.tokenizer_eval --config configs/evaluation/tokenizer_hanja.yaml --split dev_hanja --tag d1
# 입력은 tools/build_hanja_subset.py 가 만든다.
#
# 등록 비교는 T2a vs C0 이다. T2b 는 descriptive.
# 도메인 행이 나오지만 **도메인별로 인용하지 않는다** (라벨 정확도 ~55%, docs/DOMAIN_LABELS.md).
# 판정은 부분집합 전체 합계의 tok_per_byte 로 한다 — 예측: T2a 는 C0 의 2% 안.

tokenizers:
  - name: qwen_original
    repo_id: Qwen/Qwen2.5-0.5B
    revision: 060db6499f32faf8b98477b0a26969ef7d8b9987
  - name: t2a_v1_n30000
    path: artifacts/tokenizers/kot2a_v1_n30000
  - name: t2b_v2_n30000
    path: artifacts/tokenizers/kot2b_v2_n30000

data:
  # v1 코퍼스. 원장 data_v1_seed42 에서 읽은 값이다 (docs/PLAN.md 고정된 계보).
  manifest_sha256: e993d3267eea5ec0096c39d0dc8cf17c0e02561d4d02371a625f85b5ea80f25c
  split: dev_hanja
  # 전체 평균 하나만 내지 않는다. 도메인별로 행을 남긴다 (스펙 §16).
  # v1 코퍼스에 실제로 있는 라벨. 한국어 내부 세분화는 감사 정확도 ~55% 라
  # 보고는 news / 기타 까지만 한다 (docs/DOMAIN_LABELS.md).
  domains: [news, encyclopedia, blog, community, technical, ko_en_mixed,
            web_general, code, english]

metrics:
  compression: [tok_per_char, tok_per_byte, bytes_per_tok, tok_per_eojeol]
  length_percentiles: [50, 90, 95, 99]
  # 검토 A7: fertility 는 "정답 분절"이 있어야 계산된다. 분석기와 버전을 고정한다.
  # 정하기 전에는 fertility_mean 을 NA 로 둔다 — 비워두는 것이 임의 정의보다 낫다.
  # 2026-08-30 분석기를 kiwipiepy 로 고정하고 켰다. 버전은 측정 때마다
  # tokenizer_metrics.tsv 와 화면에 남는다.
  fertility:
    enabled: true
    analyzer: kiwipiepy
    analyzer_version: "0.23.2"

# 스펙 §17 Candidate Gate — 보고 중심 + 파국 방지 하한
#
# 2026-08-30 결정. T2 후보를 만들기 **전에** 정했다. 결과를 보고 완화하면
# §107 evaluation freeze 를 어긴다 (docs/RULES.md 14번).
#
# 왜 바꿨나: 스펙 §17 의 원래 조건(영어 5%, 코드 10%)을 그대로 적용했더니
# HCX-SEED(코드 +20.9%)와 A.X-4.0-Light(영어 +7.3%, 코드 +26.6%)가 둘 다
# 탈락했다. A.X 는 실제 출시된 산업 토크나이저다. 출시된 제품을 거르는 게이트는
# 우리가 연구하려는 설계 지점 자체를 배제한다 — 임계값이 잘못 맞춰진 것이다.
#
# report  스펙 §17 값. 넘으면 경고로 보고하되 거르지 않는다. 모든 후보의
#         trade-off 를 표로 남기는 것이 §16 의 목적에 맞다.
# hard    관측된 산업 지점(A.X: 영어 7.3%, 코드 26.6%)보다 넉넉히 위.
#         망가진 토크나이저가 학습 예산을 태우는 것만 막는다.
gate:
  korean_tok_per_char_improvement_min: 0.15   # 스펙 §17 그대로. 이건 하드 조건이다.
  english_degradation_report: 0.05
  code_degradation_report: 0.10
  english_degradation_hard: 0.25
  code_degradation_hard: 0.40
