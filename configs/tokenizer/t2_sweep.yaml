# T2a / T2b N 스윕 (Step 3).
#
# N 을 CPT 로 스윕하면 GPU 예산이 터진다. Level 1 은 dev 에서 몇 분이면
# 끝나므로 CPU 에서 N 을 먼저 고르고, 고른 N 하나로만 CPT 를 돌린다.
#
# 기준선 qwen_original 은 반드시 첫 항목이어야 한다 (증감률의 분모).
# t2a 와 t2b 는 같은 prune_<N>.tsv 를 쓴다 — 그래야 축소 vs 치환 비교다.

